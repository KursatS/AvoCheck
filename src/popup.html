<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <title>AvoCheck Popup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./input.css">
  <link rel="stylesheet" href="./theme.css">
  <style>
    :root {
      --width: 470px;
      --height: 330px;
      --radius: 24px;
      --text-main: #fff;
      --popup-text-muted: rgba(255, 255, 255, 0.92);
      --grad-recci: linear-gradient(135deg, #059669 0%, #10b981 100%);
      --grad-warning: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
      --grad-none: linear-gradient(135deg, #334155 0%, #475569 100%);
      --grad-error: linear-gradient(135deg, #b91c1c 0%, #ef4444 100%);
      --fs-status: 20px;
      --fs-serial: 32px;
      --fs-model: 22px;
    }

    .size-1 { --width: 400px; --height: 300px; --radius: 20px; --fs-status: 18px; --fs-serial: 26px; --fs-model: 18px; }
    .size-2 { --width: 460px; --height: 330px; --radius: 24px; --fs-status: 20px; --fs-serial: 30px; --fs-model: 21px; }
    .size-3 { --width: 500px; --height: 350px; --radius: 28px; --fs-status: 22px; --fs-serial: 34px; --fs-model: 24px; }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
    }

    .popup-container {
      width: 100%;
      height: 100%;
      background: var(--grad-none);
      border-radius: var(--radius);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 20px;
      /* Zero outer box-shadow: completely prevents Windows DWM black haze and rectangular blur */
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.45);
      border: none;
      outline: none;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.86) translateY(20px);
      transform-origin: bottom center;
      will-change: transform, opacity;
      -webkit-font-smoothing: antialiased;
    }

    /* Spring-loaded Pop Entrance without scale overflow */
    .animate-pop {
      animation: springPop 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes springPop {
      0% {
        opacity: 0;
        transform: scale(0.86) translateY(24px);
      }
      70% {
        opacity: 1;
        transform: scale(1.0) translateY(-2px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Snappy Exit */
    .pop-out {
      animation: popOut 0.16s cubic-bezier(0.4, 0, 1, 1) forwards !important;
    }

    @keyframes popOut {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(0.82) translateY(16px);
      }
    }

    /* Color themes */
    .theme-recci { background: var(--grad-recci); }
    .theme-warning { background: var(--grad-warning); }
    .theme-none { background: var(--grad-none); }
    .theme-error { background: var(--grad-error); }

    .close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 50;
    }

    .close-btn:hover {
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      transform: scale(1.1);
    }

    .status-badge {
      background: rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      margin-bottom: 14px;
      max-width: calc(100% - 32px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    .check-icon {
      width: 20px;
      height: 20px;
      fill: var(--text-main);
      stroke: var(--text-main);
      flex-shrink: 0;
    }

    .status-text {
      color: var(--text-main);
      font-size: var(--fs-status);
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.25;
    }

    .serial-number {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: var(--fs-serial);
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 6px;
      line-height: 1.1;
      letter-spacing: 0.5px;
      word-break: break-word;
    }

    .model-info {
      font-size: var(--fs-model);
      font-weight: 600;
      color: var(--popup-text-muted);
      margin-bottom: 12px;
      line-height: 1.25;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 5px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .copy-button {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 10px 24px;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(5px);
    }

    .copy-button:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    .progress-wrapper {
      position: absolute;
      bottom: 10px;
      left: 20px;
      right: 20px;
      height: 5px;
      background: rgba(0, 0, 0, 0.2);
      overflow: hidden;
      border-radius: 999px;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
      border-radius: 999px;
      transform-origin: left center;
      will-change: transform;
      transform: scaleX(1);
    }
  </style>
</head>

<body>
  <div id="popup" class="popup-container">
    <button id="close-btn" class="close-btn" aria-label="Kapat">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M13 1L1 13M1 1L13 13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
      </svg>
    </button>

    <div class="status-badge">
      <div id="status-icon-container">
        <svg class="check-icon" viewBox="0 0 24 24">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
        </svg>
      </div>
      <span id="status-text" class="status-text">Yükleniyor...</span>
    </div>

    <div id="serial" class="serial-number">...</div>
    <div id="model" class="model-info">...</div>
    <div id="date-badge" class="date-badge" style="display:none;"></div>

    <button id="copy-btn" class="copy-button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
      </svg>
      <span id="copy-btn-text">Model Kopyala</span>
    </button>

    <div id="progress-wrapper" class="progress-wrapper">
      <div id="progress" class="progress-bar"></div>
    </div>
  </div>

  <script>
    const icons = {
      check: '<svg class="check-icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" /></svg>',
      warning: '<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>',
      error: '<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>',
      info: '<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>'
    };

    const popup = document.getElementById('popup');
    const statusText = document.getElementById('status-text');
    const statusIconContainer = document.getElementById('status-icon-container');
    const serialDisplay = document.getElementById('serial');
    const modelDisplay = document.getElementById('model');
    const dateBadge = document.getElementById('date-badge');
    const copyBtn = document.getElementById('copy-btn');
    const copyBtnText = document.getElementById('copy-btn-text');
    const progress = document.getElementById('progress');
    const closeBtn = document.getElementById('close-btn');

    let progressAnim = null;

    function startProgressCountdown(durationMs) {
      if (progressAnim) {
        try { progressAnim.cancel(); } catch (e) {}
      }
      progress.style.transform = 'scaleX(1)';
      // Web Animations API: Runs purely on compositor GPU thread at display refresh rate (144Hz+)
      progressAnim = progress.animate([
        { transform: 'scaleX(1)' },
        { transform: 'scaleX(0)' }
      ], {
        duration: durationMs,
        easing: 'linear',
        fill: 'forwards'
      });
    }

    closeBtn.addEventListener('click', () => {
      if (progressAnim) {
        try { progressAnim.pause(); } catch (e) {}
      }
      popup.classList.add('pop-out');
      setTimeout(() => {
        window.electronAPI.closeWindow();
      }, 160);
    });

    window.electronAPI.onPopupData((info, duration) => {
      const status = (info.warranty_status || '').toUpperCase();
      const isError = info.is_error || status.includes('HATA') || status.includes('BAĞLANTI');

      popup.className = 'popup-container size-' + (info.sizeLevel || 2);
      popup.classList.remove('theme-recci', 'theme-warning', 'theme-none', 'theme-error', 'animate-pop', 'pop-out');

      serialDisplay.textContent = info.serial || '';
      dateBadge.style.display = 'none';
      copyBtn.style.display = 'none';

      let cleanModel = (info.model_name || '').toUpperCase().trim()
        .replace(/^ROBOROCK\s+/i, '').replace(/^ROBOROCK$/i, '').replace(/QREVO/g, 'Q REVO').trim();
      let cleanColor = (info.model_color || '').toUpperCase().trim()
        .replace(/QREVO/g, 'Q REVO').trim();

      if (cleanColor && cleanModel.endsWith(cleanColor)) {
        cleanModel = cleanModel.substring(0, cleanModel.length - cleanColor.length).trim();
      }

      const formattedModelStr = cleanColor ? `${cleanModel} - ${cleanColor}` : cleanModel;

      // 1. Kırmızı: İnternet Bağlantı Hatası
      if (isError) {
        popup.classList.add('theme-error');
        statusText.textContent = 'İNTERNET BAĞLANTI HATASI';
        statusIconContainer.innerHTML = icons.error;
        modelDisplay.textContent = 'Sunucuya ulaşılamadı, bağlantınızı kontrol edin';
      }
      // 2. Yeşil: Recci Garantili
      else if (status.includes('GARANTİLİ') && !status.includes('DOLMUŞ') && !status.includes('FATURA')) {
        popup.classList.add('theme-recci');
        statusText.textContent = 'RECCI GARANTİLİ';
        statusIconContainer.innerHTML = icons.check;
        modelDisplay.textContent = formattedModelStr || 'ROBOROCK';
        if (info.warranty_end) {
          dateBadge.textContent = 'Bitiş Tarihi: ' + info.warranty_end;
          dateBadge.style.display = 'inline-flex';
        }
        copyBtn.style.display = 'inline-flex';
      }
      // 3. Sarı: Garantisiz ama Fatura / Bitiş Tarihi Var
      else if (status.includes('FATURA') || status.includes('DOLMUŞ') || info.warranty_end) {
        popup.classList.add('theme-warning');
        statusText.textContent = 'SÜRESİ DOLMUŞ (FATURA KONTROL)';
        statusIconContainer.innerHTML = icons.warning;
        modelDisplay.textContent = formattedModelStr || 'ROBOROCK';
        if (info.warranty_end) {
          dateBadge.textContent = '📅 Bitiş Tarihi: ' + info.warranty_end;
          dateBadge.style.display = 'inline-flex';
        } else {
          dateBadge.textContent = '⚠️ Lütfen Fatura Tarihini İnceleyin!';
          dateBadge.style.display = 'inline-flex';
        }
        copyBtn.style.display = 'inline-flex';
      }
      // 4. Gri: Garantisiz ve Tarih Yok
      else {
        popup.classList.add('theme-none');
        statusText.textContent = 'GARANTİ DIŞI';
        statusIconContainer.innerHTML = icons.info;
        modelDisplay.textContent = formattedModelStr || 'Roborock Türkiye Garanti Dışı';
        copyBtn.style.display = 'none';
      }

      copyBtn.onclick = () => {
        const textToCopy = formattedModelStr || info.serial || '';
        navigator.clipboard.writeText(textToCopy);
        const originalText = copyBtnText.textContent;
        copyBtnText.textContent = 'Kopyalandı!';
        setTimeout(() => { copyBtnText.textContent = originalText; }, 1500);
      };

      // Trigger spring-loaded pop-in animation on data display
      void popup.offsetWidth; // layout reflow
      popup.classList.add('animate-pop');

      // Start hardware-accelerated progress countdown
      startProgressCountdown(duration);

      popup.onmouseenter = () => {
        if (progressAnim && progressAnim.playState === 'running') {
          progressAnim.pause();
        }
        window.electronAPI.popupHoverEnter();
      };

      popup.onmouseleave = () => {
        if (progressAnim && progressAnim.playState === 'paused') {
          progressAnim.play();
        }
        window.electronAPI.popupHoverLeave();
      };
    });
  </script>
</body>

</html>
