<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./input.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    body {
      width: 600px;
      height: 400px;
      background: #14110f;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, rgba(16, 185, 129, 0.2) 0%, transparent 50%);
      animation: rotate 10s linear infinite;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .content {
      z-index: 10;
      text-align: center;
      animation: fadeIn 1s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .splash-logo {
      width: 84px;
      height: 84px;
      border-radius: 22px;
      margin-bottom: 12px;
      box-shadow: 0 10px 28px rgba(16, 185, 129, 0.35);
      border: 2px solid rgba(255, 255, 255, 0.15);
      object-fit: cover;
      animation: floatLogo 3s ease-in-out infinite;
    }

    @keyframes floatLogo {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .version {
      font-size: 1rem;
      font-weight: 600;
      color: #10b981;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .loader {
      margin-top: 30px;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .brand {
      position: absolute;
      bottom: 24px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <div class="content">
    <img src="./assets/logo.png" alt="AvoCheck" class="splash-logo">
    <h1>AvoCheck</h1>
    <div class="version">Garanti & Metin Asistanı</div>
    <div class="loader" style="margin-left: auto; margin-right: auto;"></div>
  </div>
  <div class="brand">Geliştirici: Kürşat Sinan | AvoCheck</div>
</body>

</html>
